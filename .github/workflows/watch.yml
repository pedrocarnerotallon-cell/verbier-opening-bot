name: Verbier Opening Session watcher

on:
  schedule:
    - cron: "*/30 * * * *"   # respaldo por si la cadena se rompe
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Mandar notificación de prueba al arrancar"
        type: boolean
        default: false

concurrency:
  group: verbier-watch
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'pedro-verbier-208b0367' }}
          INTERVAL_SECONDS: "30"
          RUN_FOR_SECONDS: "20400"   # 5h40m
          TEST_NOTIFY: ${{ github.event.inputs.test_notify == 'true' && '1' || '0' }}
        run: python watcher.py
      - name: Lanzar la siguiente ejecución
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref main -f test_notify=false
