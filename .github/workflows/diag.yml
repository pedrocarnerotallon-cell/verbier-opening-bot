name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p diag && curl -s "https://ntfy.sh/pedro-verbier-208b0367/json?poll=1&since=all" > diag/ntfy.txt || true
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f diag && git commit -m "diag results" && git push origin HEAD:diag-results --force
