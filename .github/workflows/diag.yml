name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          mkdir -p diag
          echo "token_len=${#TG}" > diag/tg.txt
          curl -s "https://api.telegram.org/bot$TG/getUpdates" > /tmp/u.json || true
          python3 - >> diag/tg.txt 2>&1 <<'PY' || true
          import json
          d=json.load(open('/tmp/u.json')); print('ok', d.get('ok'), d.get('description',''))
          seen=set()
          for u in d.get('result',[]):
              for k in ('message','my_chat_member','channel_post'):
                  c=(u.get(k) or {}).get('chat')
                  if c and c['id'] not in seen:
                      seen.add(c['id']); print(c['id'], c.get('type'), c.get('title') or c.get('first_name'))
          PY
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f diag && git commit -m "diag results" && git push origin HEAD:diag-results --force
